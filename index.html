<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c2607a">
<title>akasia.flo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf7f4;--ink:#2b211e;--mute:#8b7f7a;--rose:#c2607a;--line:#eadfd9;--card:#fff;--green:#4f8a6a;--blue:#3d5f94;--red:#c0392b;
--gbg:#e8f3ec;--bbg:#e9eefa;--rbg:#fce8ea;
font-family:'DM Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ink)}
body{padding:calc(env(safe-area-inset-top,0px) + 24px) 20px 120px;max-width:640px;margin:auto}
.serif,h1,h2,.big{font-family:'Cormorant Garamond',serif}
.sub{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--mute);font-size:17px}
h1{font-size:40px;line-height:1.1;margin:4px 0 22px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat{border-radius:22px;padding:18px;border:1px solid var(--line)}
.stat small{color:var(--mute);font-size:14px}
.big{font-size:30px;font-weight:600;margin-top:14px}
.row{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.row b{font-weight:600}.row small{color:var(--mute);display:block;margin-top:2px}
.btn{border:1.5px solid var(--rose);background:#fff;color:var(--rose);border-radius:16px;padding:12px 18px;font:500 15px 'DM Sans';cursor:pointer}
.btn.p{background:var(--rose);color:#fff;box-shadow:0 6px 16px #c2607a44}
.btn.big2{flex:1;padding:22px 10px;text-align:center;font-size:16px;font-weight:600;border-radius:20px}
.btn.big2 span{display:block;font-weight:400;font-size:13px;margin-top:4px;opacity:.8}
.bar{display:flex;gap:10px;margin-bottom:16px}
input,select{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;font:15px 'DM Sans';background:#fff;color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px}
.cat{background:#f3ece8;border-radius:18px;padding:14px 16px;margin-top:12px}
.cat summary{cursor:pointer;font-weight:600;display:flex;gap:10px;align-items:center}
.cat summary span{background:#fde9ee;color:var(--rose);border-radius:99px;padding:1px 10px;font-size:13px;font-weight:400}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.item:first-of-type{margin-top:10px}
.x{background:none;border:none;color:var(--mute);font-size:18px;cursor:pointer;padding:4px 8px}
.in{color:var(--green)}.out{color:var(--red)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1}
.tabs .btn:not(.p){border-color:var(--line);color:var(--mute)}
.empty{color:var(--mute);text-align:center;padding:36px 10px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:min(92vw,420px);background:var(--ink);border-radius:36px;padding:8px;display:flex;justify-content:space-around;z-index:5}
nav button{width:56px;height:56px;border-radius:50%;border:none;background:none;font-size:22px;cursor:pointer;opacity:.6;filter:grayscale(1) brightness(1.6)}
nav button.on{background:var(--rose);opacity:1;filter:none}
dialog{border:none;border-radius:24px;padding:22px;width:min(92vw,460px);max-height:88vh;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:#2b211e88}
dialog h2{font-size:28px;margin-bottom:4px}
.sum{background:var(--gbg);border-radius:16px;padding:14px;margin:14px 0;display:grid;gap:6px}
.sum div{display:flex;justify-content:space-between}
.sum .t{font-weight:600;font-size:17px}
@media(prefers-reduced-motion:no-preference){.view{animation:f .25s ease}@keyframes f{from{opacity:0}}}
dialog{width:min(94vw,540px)!important}
.seg{display:flex;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.seg button{flex:1;border:0;background:none;padding:11px 6px;font:500 14px 'DM Sans';color:var(--mute);cursor:pointer}
.seg button.on{background:var(--rose);color:#fff}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ln{display:grid;grid-template-columns:36px 1fr 64px 80px 24px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.ln small{display:block;color:var(--mute)}.ln .s{text-align:right;font-weight:600}
.pr{background:var(--ink);color:#fff;border-radius:20px;padding:18px;margin:14px 0}
.pr .big{font-size:38px;margin:2px 0}.pr small{color:#cdbfb9}
.pr .r{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.pr .r.t{border-top:1px solid #5a4a45;border-bottom:1px solid #5a4a45;margin:4px 0;font-weight:700;padding:7px 0}
h3.g{font-family:'Cormorant Garamond',serif;font-size:21px;margin-top:18px}
.th{width:44px;height:44px;border-radius:12px;overflow:hidden;background:#f3ece8;border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--mute);font:600 20px 'Cormorant Garamond',serif;padding:0}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.sm{width:36px;height:36px;border-radius:9px;font-size:17px}.th.lg{width:96px;height:96px;border-radius:16px;font-size:34px}.th.sq{width:100%;height:auto;aspect-ratio:1;border-radius:10px;font-size:30px}
button.th{cursor:pointer}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-top:8px}
.pc{position:relative;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:4px;font:inherit;color:var(--ink)}
.pc b{font-weight:600;font-size:13px;line-height:1.25}.pc small{color:var(--mute);font-size:12px}
.bd{position:absolute;top:12px;right:12px;background:var(--rose);color:#fff;border-radius:99px;min-width:24px;height:24px;display:grid;place-items:center;font-size:13px;font-weight:600;padding:0 6px}
.bd[hidden]{display:none}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<dialog id="dlg"></dialog>
<dialog id="pk"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.78.0/dist/umd/supabase.min.js"></script>
<script>
const rp=n=>'Rp'+Math.round(n||0).toLocaleString('id-ID');
const uid=()=>Math.random().toString(36).slice(2,9);
const KEY='flawarist-v1';
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{bahan:[],produk:[],trx:[]};
/* === ISI DUA BARIS INI dari Supabase: Project Settings → API === */
const SUPABASE_URL='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1dW5lcmp2eXN0YXV1eWdydXNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwNjU3NzEsImV4cCI6MjEwOTY0MTc3MX0.B5PWHxTMaoBFhbMjzQsKTZSzRFC_23TX2WSy7JquqyY';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1dW5lcmp2eXN0YXV1eWdydXNrIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5NDA2NTc3MSwiZXhwIjoyMTA5NjQxNzcxfQ._MtEHswH-pyaKasVDBEqxWm2D_tnRdPHaac7ePHVGDI';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
 if(user){clearTimeout(timer);timer=setTimeout(push,600)}};
let view='dash',tab='semua',draft;
const KAT=['Buket','Pita & Packaging','Aksesoris'];
const $=s=>document.querySelector(s),dlg=$('#dlg');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const HARI=[[1,1,'Tahun Baru'],[14,2,'Valentine'],[8,3,'Hari Perempuan'],[21,4,'Hari Kartini'],[12,5,'Hari Ibu Sedunia'],[25,11,'Hari Guru'],[22,12,'Hari Ibu']];
function nextHari(){const n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());
 let best;for(const[d,m,nm]of HARI){let x=new Date(t.getFullYear(),m-1,d);if(x<t)x=new Date(t.getFullYear()+1,m-1,d);
  if(!best||x<best.x)best={x,nm,d,m}}
 const bln=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
 return{nm:best.nm,hari:Math.round((best.x-t)/864e5),tgl:best.d+' '+bln[best.m-1]}}

const hpp=p=>p.items.reduce((a,i)=>{const b=S.bahan.find(x=>x.id===i.bid);return a+(b?b.harga*i.qty:0)},0);
const totals=()=>{const i=S.trx.filter(t=>t.jenis==='in').reduce((a,t)=>a+t.jml,0),o=S.trx.filter(t=>t.jenis==='out').reduce((a,t)=>a+t.jml,0);return{i,o,s:i-o}};

const NAV=[['dash','🏠'],['bahan','🏷️'],['hpp','🧮'],['trx','💰']];
function render(){
 $('#nav').innerHTML=NAV.map(([k,e])=>`<button class="${view===k?'on':''}" aria-label="${k}" onclick="go('${k}')">${e}</button>`).join('');
 $('#app').innerHTML='<div class="view">'+({dash,bahan,hpp:hppv,trx:trxv}[view])()+'</div>';
 window.scrollTo(0,0)}
const go=v=>{view=v;render()};

function dash(){const t=totals(),h=nextHari();
 return`<div class="sub">Selamat datang kembali ✨</div><h1>Dashboard akasia.flo</h1>
 <div class="grid">
 <div class="stat" style="background:var(--gbg)"><small>Saldo Kas 💰</small><div class="big" style="color:var(--green)">${rp(t.s)}</div></div>
 <div class="stat" style="background:var(--bbg)"><small>Total Pemasukan 📈</small><div class="big" style="color:var(--blue)">${rp(t.i)}</div></div>
 <div class="stat" style="background:var(--rbg)"><small>Total Pengeluaran 📉</small><div class="big" style="color:var(--red)">${rp(t.o)}</div></div>
 <div class="stat" style="background:#fbe9ef"><small>Template Produk 🌸</small><div class="big" style="color:var(--rose)">${S.produk.length}</div></div></div>
 <div class="row" style="padding:22px 20px"><div><b class="serif" style="font-size:24px">📅 Kalender Penting</b><small>${h.nm} • ${h.hari} hari lagi (${h.tgl})</small></div></div>
 <div class="bar" style="margin-top:22px"><button class="btn p big2" onclick="go('hpp')">🧮 Hitung HPP<span>Buat / lihat template produk</span></button>
 <button class="btn big2" onclick="go('trx')">💰 Catat Transaksi<span>Pemasukan &amp; pengeluaran</span></button></div>
 <div class="bar"><button class="btn" onclick="backup()">Unduh cadangan</button><button class="btn" onclick="restore()">Pulihkan data</button>${user?'<button class="btn" onclick="logout()">Keluar</button>':''}</div>`}

/* ---------- BAHAN ---------- */
let q='';
function bahan(){
 const list=S.bahan.filter(b=>b.nama.toLowerCase().includes(q.toLowerCase()));
 const cats=[...new Set([...KAT,...S.bahan.map(b=>b.kat)])];
 return`<div class="sub">Kalkulator Pecah Harga</div><h1>Daftar Harga Bahan</h1>
 <div class="bar"><button class="btn p" onclick="formBahan()">+ Tambah Bahan</button></div>
 <input placeholder="🔍 Cari nama bahan..." value="${esc(q)}" oninput="q=this.value;keep()">
 <div id="bl">${bl(list,cats)}</div>`}
function bl(list,cats){return cats.map(c=>{const it=list.filter(b=>b.kat===c);
 return`<details class="cat" ${q&&it.length?'open':''}><summary>${esc(c)} <span>${it.length}</span></summary>
 ${it.map(b=>`<div class="item"><div style="display:flex;gap:10px;align-items:center">${th(b.photo,b.nama,'sm')}<div>${esc(b.nama)}<br><small style="color:var(--mute)">${rp(b.harga)} / ${esc(b.satuan)}</small></div></div><span><button class="x" onclick="formBahan('${b.id}')">✎</button><button class="x" onclick="del('bahan','${b.id}')">✕</button></span></div>`).join('')||'<div class="item" style="color:var(--mute)">Belum ada bahan</div>'}</details>`}).join('')}
function keep(){const list=S.bahan.filter(b=>b.nama.toLowerCase().includes(q.toLowerCase()));$('#bl').innerHTML=bl(list,[...new Set([...KAT,...S.bahan.map(b=>b.kat)])])}
function formBahan(id){const b=S.bahan.find(x=>x.id===id)||{nama:'',kat:'Buket',harga:'',satuan:'pcs'};
 bph=b.photo||'';dlg.innerHTML=`<h2>${id?'Ubah':'Tambah'} Bahan</h2>
 <label>Nama bahan</label><input id="f1" value="${esc(b.nama)}" placeholder="Mawar merah">
 <label>Kategori (pilih atau ketik baru)</label><input id="f2" list="kl" value="${esc(b.kat)}"><datalist id="kl">${[...new Set([...KAT,...S.bahan.map(x=>x.kat)])].map(k=>`<option value="${esc(k)}">`).join('')}</datalist>
 <label>Jenis (menentukan hitungan susut)</label><select id="f5"><option value="flower" ${isFl(b)?'selected':''}>Bunga &amp; daun (kena susut)</option><option value="material" ${isFl(b)?'':'selected'}>Kemasan &amp; bahan</option></select>
 <label>Foto (opsional)</label><div style="display:flex;gap:10px;align-items:center"><span id="bpv">${th(bph,b.nama,'lg')}</span><button class="btn" onclick="pickB()">Pilih foto</button><button class="btn" onclick="bph='';$('#bpv').innerHTML=th('','?','lg')">Hapus</button></div>
 <label>Harga per satuan (Rp)</label><input id="f3" type="number" inputmode="numeric" value="${b.harga}">
 <label>Satuan</label><input id="f4" value="${esc(b.satuan)}" placeholder="tangkai, meter, pcs">
 <div class="bar" style="margin-top:20px"><button class="btn" onclick="dlg.close()">Batal</button><button class="btn p" onclick="saveBahan('${id||''}')">Simpan bahan</button></div>`;dlg.showModal()}
function saveBahan(id){const o={nama:$('#f1').value.trim(),kat:$('#f2').value.trim()||'Buket',jenis:$('#f5').value,photo:bph,harga:+$('#f3').value,satuan:$('#f4').value.trim()||'pcs'};
 if(!o.nama||!(o.harga>=0)||$('#f3').value==='')return $('#f1').focus();
 if(id){const ex=S.bahan.find(x=>x.id===id);if(ex.photo&&ex.photo!==o.photo)rmPhoto(ex.photo);Object.assign(ex,o)}else S.bahan.push({id:uid(),...o});
 save();dlg.close();render()}

/* ---------- FOTO ---------- */
const thi=(src,name)=>src?`<img src="${src}" alt="">`:`<b>${esc((name||'?').charAt(0).toUpperCase())}</b>`;
const th=(src,name,cls='')=>`<span class="th ${cls}">${thi(src,name)}</span>`;
function pickPhoto(max,q,cb){const i=document.createElement('input');i.type='file';i.accept='image/*';
 i.onchange=()=>{const f=i.files[0];if(!f)return;const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
   c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);cb(c.toDataURL('image/jpeg',q))};
  im.onerror=()=>alert('Foto tidak bisa dibaca, coba foto lain.');im.src=u};i.click()}
let bph='';
async function up(d){if(!user||!sb||!d||!d.startsWith('data:'))return d;
 try{const b=await(await fetch(d)).blob(),p=`${user.id}/${uid()}.jpg`;
  const r=await sb.storage.from('foto').upload(p,b,{contentType:'image/jpeg'});if(r.error)throw r.error;
  return sb.storage.from('foto').getPublicUrl(p).data.publicUrl}
 catch(e){alert('Foto belum bisa diunggah ke cloud, disimpan di perangkat dulu.');return d}}
function rmPhoto(u){if(!user||!sb||!u||u.startsWith('data:'))return;const i=u.indexOf('/foto/');if(i<0)return;sb.storage.from('foto').remove([decodeURIComponent(u.slice(i+6))]).catch(()=>{})}
async function migrate(){let ch=false;for(const o of[...S.bahan,...S.produk])if(o.photo&&o.photo.startsWith('data:')){o.photo=await up(o.photo);ch=true}if(ch)save()}
function pickB(){const e=$('#f1');pickPhoto(240,.7,async d=>{d=await up(d);bph=d;$('#bpv').innerHTML=th(d,'','lg')})}
function photoP(){keepName();pickPhoto(560,.7,async d=>{d=await up(d);draft.photo=d;drawProduk()})}
function openPick(fl){keepName();const pk=$('#pk');
 pk.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2>${fl?'Pilih bunga':'Pilih kemasan dan bahan'}</h2><button class="btn p" onclick="$('#pk').close()">Selesai</button></div><p style="color:var(--mute);font-size:14px;margin-top:6px">Ketuk untuk menambah satu, ketuk lagi untuk menambah jumlahnya.</p>`+
 ([...new Set(S.bahan.filter(b=>isFl(b)===fl).map(b=>b.kat))].map(g=>`<h3 class="g">${esc(g)}</h3><div class="pg">${S.bahan.filter(b=>isFl(b)===fl&&b.kat===g).map(b=>{const l=draft.items.find(i=>i.bid===b.id);
  return`<button class="pc" onclick="pickIt('${b.id}')">${th(b.photo,b.nama,'sq')}<b>${esc(b.nama)}</b><small>${rp(b.harga)} / ${esc(b.satuan)}</small><span class="bd" id="bd${b.id}" ${l?'':'hidden'}>${l?l.qty:''}</span></button>`}).join('')}</div>`).join('')||'<div class="empty">Tambah bahan dulu di Daftar Harga Bahan.</div>');
 pk.showModal()}
function pickIt(id){let l=draft.items.find(i=>i.bid===id);l?l.qty+=1:draft.items.push(l={bid:id,qty:1});const e=document.getElementById('bd'+id);e.hidden=false;e.textContent=l.qty}
$('#pk').addEventListener('close',()=>{if(dlg.open)drawProduk()});

/* ---------- HPP ---------- */
const num=v=>{v=parseFloat(v);return isFinite(v)&&v>0?v:0};
const isFl=b=>(b.jenis||(b.kat==='Buket'?'flower':'material'))==='flower';
function normP(p){const d={susut:5,labor:15000,overhead:p.tambah||0,mode:'margin',pct:40,fee:0,round:1000};for(const k in d)if(p[k]===undefined)p[k]=d[k];return p}
function calc(p){let fl=0,pk=0;p.items.forEach(i=>{const b=S.bahan.find(x=>x.id===i.bid);if(!b)return;const v=b.harga*i.qty;isFl(b)?fl+=v:pk+=v});
 const susut=fl*num(p.susut)/100,labor=num(p.labor),oh=num(p.overhead),h=fl+susut+pk+labor+oh;
 const pc=p.mode==='margin'?Math.min(num(p.pct),95)/100:num(p.pct)/100,base=p.mode==='margin'?h/(1-pc):h*(1+pc),f=Math.min(num(p.fee),50)/100;
 let price=base/(1-f);const st=num(p.round);if(st>0)price=Math.ceil(price/st-1e-9)*st;
 const fee=price*f,profit=price-fee-h;
 return{fl,susut,pk,labor,oh,h,price,fee,profit,margin:price?profit/price*100:0,markup:h?profit/h*100:0,be:h/(1-f)}}
const pc1=n=>n.toLocaleString('id-ID',{maximumFractionDigits:1})+'%';
function hppv(){
 return`<div class="sub">Template produk</div><h1>Hitung HPP</h1>
 <div class="bar"><button class="btn p" onclick="formProduk()">+ Hitung Bouquet Baru</button></div>
 ${S.produk.map(p=>{normP(p);const r=calc(p);return`<div class="row"><div onclick="formProduk('${p.id}')" style="cursor:pointer;flex:1;display:flex;gap:12px;align-items:center">${th(p.photo,p.nama)}<div><b>${esc(p.nama)}</b><small>HPP ${rp(r.h)} • jual ${rp(r.price)}</small><small class="in">Laba ${rp(r.profit)} (margin ${pc1(r.margin)})</small></div></div>
 <span><button class="x" onclick="formProduk('${p.id}')">✎</button><button class="x" onclick="del('produk','${p.id}')">✕</button></span></div>`}).join('')||'<div class="empty">Belum ada bouquet. Isi daftar bahan dulu, lalu hitung bouquet pertamamu.</div>'}`}
function formProduk(id){const p=S.produk.find(x=>x.id===id);draft=normP(p?JSON.parse(JSON.stringify(p)):{id:'',nama:'',items:[]});drawProduk()}
function lines(fl){const rows=draft.items.map((i,n)=>{const b=S.bahan.find(x=>x.id===i.bid);return b&&isFl(b)===fl?`<div class="ln">${th(b.photo,b.nama,'sm')}<div>${esc(b.nama)}<small>${rp(b.harga)} / ${esc(b.satuan)}</small></div><input type="number" step="any" min="0" inputmode="decimal" value="${i.qty}" oninput="draft.items[${n}].qty=num(this.value);sumP()"><div class="s" id="sb${n}">${rp(b.harga*i.qty)}</div><button class="x" onclick="draft.items.splice(${n},1);keepName();drawProduk()">✕</button></div>`:''}).join('');
 return rows||'<div class="hint" style="color:var(--mute);font-size:14px;padding:6px 0">Belum ada.</div>'}
function opts(fl){const gs=[...new Set(S.bahan.filter(b=>isFl(b)===fl).map(b=>b.kat))];return gs.map(g=>`<optgroup label="${esc(g)}">${S.bahan.filter(b=>isFl(b)===fl&&b.kat===g).map(b=>`<option value="${b.id}">${esc(b.nama)} – ${rp(b.harga)}</option>`).join('')}</optgroup>`).join('')}
function addBox(fl){const k=fl?'a':'m';return`<div class="bar" style="margin:10px 0 8px"><button class="btn" onclick="openPick(${fl})">📷 Pilih dari foto</button></div><div class="bar" style="margin:0"><select id="s${k}">${opts(fl)||'<option value="">Tambah bahan dulu</option>'}</select><button class="btn p" onclick="addIt('s${k}')">Tambah</button></div>`}
function fld(k,l,step){return`<label>${l}<input type="number" min="0" step="${step||'any'}" inputmode="decimal" value="${draft[k]}" oninput="draft.${k}=num(this.value);sumP()"></label>`}
function drawProduk(){const keepScroll=dlg.scrollTop;
 dlg.innerHTML=`<h2>${draft.id?'Ubah':'Hitung'} Bouquet</h2>
 <div style="display:flex;gap:14px;align-items:flex-end;margin-top:8px"><button type="button" class="th lg" onclick="photoP()" aria-label="Foto bouquet">${thi(draft.photo,draft.nama||'B')}</button><div style="flex:1"><label style="margin-top:0">Nama bouquet</label><input id="p1" value="${esc(draft.nama)}" placeholder="Mawar Merah Klasik" oninput="draft.nama=this.value"></div></div>
 <div class="bar" style="margin-top:10px"><button class="btn" onclick="photoP()">${draft.photo?'Ganti foto hasil buket':'📷 Tambah foto hasil buket'}</button>${draft.photo?'<button class="btn" onclick="draft.photo=\'\';keepName();drawProduk()">Hapus foto</button>':''}</div>
 <h3 class="g">Bunga yang dipakai</h3>${lines(true)}${addBox(true)}
 <h3 class="g">Kemasan dan bahan</h3>${lines(false)}${addBox(false)}
 <h3 class="g">Biaya lain</h3>
 <div class="f2">${fld('susut','Susut bunga (%)')}${fld('labor','Tenaga kerja (Rp)','500')}</div>
 <div class="f2">${fld('overhead','Overhead per bouquet (Rp)','500')}${fld('fee','Biaya platform (%)')}</div>
 <h3 class="g">Keuntungan</h3>
 <div class="seg"><button class="${draft.mode==='margin'?'on':''}" onclick="draft.mode='margin';keepName();drawProduk()">Margin (dari harga jual)</button><button class="${draft.mode==='markup'?'on':''}" onclick="draft.mode='markup';keepName();drawProduk()">Markup (dari HPP)</button></div>
 <div class="f2">${fld('pct',draft.mode==='margin'?'Target margin (%)':'Markup (%)')}
 <label>Pembulatan ke atas<select onchange="draft.round=+this.value;sumP()">${[[0,'Tanpa pembulatan'],[500,'Rp 500'],[1000,'Rp 1.000'],[5000,'Rp 5.000'],[10000,'Rp 10.000']].map(([v,l])=>`<option value="${v}" ${num(draft.round)===v?'selected':''}>${l}</option>`).join('')}</select></label></div>
 <div class="pr" id="sm"></div>
 <div class="bar"><button class="btn" onclick="dlg.close()">Batal</button><button class="btn" onclick="copyP()">Salin ringkasan</button><button class="btn p" onclick="saveProduk()">Simpan</button></div>`;
 sumP();if(!dlg.open)dlg.showModal();dlg.scrollTop=keepScroll}
function sumP(){const r=calc(draft),t=r.price||1,row=(l,v)=>`<div class="r"><span>${l}</span><span>${rp(v)} <small>${pc1(v/t*100)}</small></span></div>`;
 draft.items.forEach((i,n)=>{const b=S.bahan.find(x=>x.id===i.bid),e=document.getElementById('sb'+n);if(b&&e)e.textContent=rp(b.harga*i.qty)});
 const el=$('#sm');if(!el)return;
 el.innerHTML=`<small>Harga jual</small><div class="big">${rp(r.price)}</div><small>Laba ${rp(r.profit)} per bouquet • margin ${pc1(r.margin)} • markup ${pc1(r.markup)}</small>
 <div style="margin-top:12px">${row('Bunga',r.fl)}${row('Susut bunga',r.susut)}${row('Kemasan dan bahan',r.pk)}${row('Tenaga kerja',r.labor)}${row('Overhead',r.oh)}
 <div class="r t"><span>HPP</span><span>${rp(r.h)}</span></div>${row('Biaya platform',r.fee)}${row('Laba bersih',Math.max(r.profit,0))}</div>
 <small>Titik impas: ${rp(r.be)}. Jual di bawah ini berarti rugi.</small>`}
const keepName=()=>{const e=$('#p1');if(e)draft.nama=e.value};
function addIt(sel){keepName();const bid=$('#'+sel).value;if(!bid)return;const e=draft.items.find(i=>i.bid===bid);e?e.qty+=1:draft.items.push({bid,qty:1});drawProduk()}
function copyP(){const r=calc(draft),t=`${draft.nama}\nHPP: ${rp(r.h)}\nHarga jual: ${rp(r.price)}\nLaba bersih: ${rp(r.profit)} (margin ${pc1(r.margin)})`;
 try{navigator.clipboard.writeText(t).then(()=>alert('Ringkasan tersalin'),()=>prompt('Salin teks ini:',t))}catch(e){prompt('Salin teks ini:',t)}}
function saveProduk(){keepName();if(!draft.nama.trim())return $('#p1').focus();
 if(draft.id){const i=S.produk.findIndex(x=>x.id===draft.id);const old=S.produk[i];if(old.photo&&old.photo!==draft.photo)rmPhoto(old.photo);S.produk[i]=draft}else{draft.id=uid();S.produk.push(draft)}
 save();dlg.close();render()}

/* ---------- TRANSAKSI ---------- */
function trxv(){const list=S.trx.filter(t=>tab==='semua'||t.jenis===tab).sort((a,b)=>b.tgl.localeCompare(a.tgl));
 return`<div class="sub">Pemasukan &amp; pengeluaran</div><h1>Catat Transaksi</h1>
 <div class="bar"><button class="btn p" onclick="formTrx('in')">+ Pemasukan</button><button class="btn" onclick="formTrx('out')">+ Pengeluaran</button></div>
 <div class="tabs">${[['semua','Semua'],['in','Masuk'],['out','Keluar']].map(([k,l])=>`<button class="btn ${tab===k?'p':''}" onclick="tab='${k}';render()">${l}</button>`).join('')}</div>
 ${list.map(t=>`<div class="row"><div><b>${esc(t.ket)}</b><small>${t.tgl}</small></div><span class="${t.jenis}"><b>${t.jenis==='in'?'+':'−'}${rp(t.jml)}</b><button class="x" onclick="del('trx','${t.id}')">✕</button></span></div>`).join('')||'<div class="empty">Belum ada transaksi. Catat pesanan pertama atau belanja bahan.</div>'}`}
function formTrx(j){const today=new Date().toISOString().slice(0,10);
 dlg.innerHTML=`<h2>${j==='in'?'Catat Pemasukan':'Catat Pengeluaran'}</h2>
 <label>Keterangan</label><input id="t1" placeholder="${j==='in'?'Pesanan buket Bu Rina':'Beli mawar di pasar'}">
 <label>Jumlah (Rp)</label><input id="t2" type="number" inputmode="numeric">
 <label>Tanggal</label><input id="t3" type="date" value="${today}">
 <div class="bar" style="margin-top:20px"><button class="btn" onclick="dlg.close()">Batal</button><button class="btn p" onclick="saveTrx('${j}')">Simpan transaksi</button></div>`;dlg.showModal()}
function saveTrx(j){const ket=$('#t1').value.trim(),jml=+$('#t2').value;if(!ket||!(jml>0))return $('#t1').focus();
 S.trx.push({id:uid(),jenis:j,ket,jml,tgl:$('#t3').value});save();dlg.close();render()}

function del(k,id){if(!confirm('Hapus data ini?'))return;const o=S[k].find(x=>x.id===id);if(o&&o.photo)rmPhoto(o.photo);S[k]=S[k].filter(x=>x.id!==id);save();render()}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='akasia-cadangan.json';a.click()}
function restore(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{S=JSON.parse(await i.files[0].text());save();render()}catch(e){alert('File cadangan tidak valid')}};i.click()}
/* ---------- LOGIN & SINKRON ---------- */
let sb,user,timer;
function push(){return sb.from('app_data').upsert({user_id:user.id,data:S,updated_at:new Date().toISOString()})}
async function pull(){const{data}=await sb.from('app_data').select('data').eq('user_id',user.id).maybeSingle();
 if(data&&data.data){S=Object.assign({bahan:[],produk:[],trx:[]},data.data);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
 else if(S.bahan.length||S.produk.length||S.trx.length)await push()}
function authView(msg){$('#nav').innerHTML='';
 $('#app').innerHTML=`<div class="view"><div class="sub">Selamat datang ✨</div><h1>akasia.flo</h1>
 <label>Email</label><input id="a1" type="email" autocomplete="email">
 <label>Kata sandi</label><input id="a2" type="password" autocomplete="current-password">
 <p id="am" class="out" style="margin-top:12px;min-height:20px">${msg||''}</p>
 <div class="bar" style="margin-top:8px"><button class="btn p" onclick="auth('in')">Masuk</button><button class="btn" onclick="auth('up')">Daftar</button></div></div>`}
async function auth(m){const e=$('#a1').value.trim(),p=$('#a2').value;
 const r=m==='in'?await sb.auth.signInWithPassword({email:e,password:p}):await sb.auth.signUp({email:e,password:p});
 if(r.error)return $('#am').textContent=r.error.message;
 if(!r.data.session)return $('#am').textContent='Cek email untuk konfirmasi, lalu masuk.';
 user=r.data.session.user;await pull();render();migrate()}
async function logout(){await sb.auth.signOut();user=null;S={bahan:[],produk:[],trx:[]};
 try{localStorage.removeItem(KEY)}catch(e){}authView()}
(async()=>{
 if(!SUPABASE_URL){render();return}
 sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
 const{data}=await sb.auth.getSession();
 if(data.session){user=data.session.user;await pull();render();migrate()}else authView()})();
</script>
</body>
</html>
